# Coolify-Deployment (Docker Compose).
#
# Die Datenbank ist bewusst KEIN Dienst mehr in diesem Compose, sondern eine
# eigenständige Coolify-Postgres-Ressource. Nur so sichert Coolify sie über
# seine Backups; ein In-Compose-Dienst mit Volume ließe sich nicht sichern.
# Details und Ausrollreihenfolge stehen in DATENBANK-UMSTELLUNG.md.
#
# Coolify-„Magic"-Umgebungsvariablen:
#   SERVICE_FQDN_APP_3000        -> Coolify vergibt automatisch Domain + SSL für App-Port 3000
#   SERVICE_PASSWORD_APPLOGIN    -> generiertes Login-Passwort der App
#   SERVICE_BASE64_64_AUTHSECRET -> generiertes Cookie-Signaturgeheimnis
# DATABASE_URL wird NICHT hier gesetzt, sondern in Coolify als Umgebungsvariable
# der Anwendung hinterlegt und zeigt auf die Standalone-Datenbank (interner
# Hostname = deren UUID). Das Passwort gehört damit ausschließlich in die
# Coolify-Env, niemals in diese Datei.
# Für lokalen Betrieb bitte weiterhin docker-compose.yml verwenden.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_APP_3000
      # Verbindung zur eigenständigen Coolify-Postgres. Wert kommt aus der
      # Coolify-Env der Anwendung (Passthrough), z.B.
      #   postgresql://liqui:<passwort>@<db-uuid>:5432/liqui?schema=public
      - DATABASE_URL
      - APP_PASSWORD=${SERVICE_PASSWORD_APPLOGIN}
      - AUTH_SECRET=${SERVICE_BASE64_64_AUTHSECRET}
      - AUTH_URL=${AUTH_URL:-https://finance.gollenstede.app}
      - AUTH_TRUST_HOST=true
      # Microsoft Entra ID (SSO) – in Coolify unter Environment Variables setzen:
      - AUTH_MICROSOFT_ENTRA_ID_ID=${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      - AUTH_MICROSOFT_ENTRA_ID_SECRET=${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      - AUTH_MICROSOFT_ENTRA_ID_ISSUER=${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
      - NODE_ENV=production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
